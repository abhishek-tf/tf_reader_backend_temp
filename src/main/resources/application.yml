spring:
  docker:
    compose:
      enabled: false
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: reader
  profiles:
    active: local
  servlet:
    multipart:
      # No multipart config existed before ingest; Boot's 1MB default would reject every real
      # upload before the controller ever ran. Set comfortably above the contract's own 100MB
      # general cap so IngestService's own size checks are what actually reject an oversized file
      # (with the tier-aware message), not this ceiling.
      max-file-size: 110MB
      max-request-size: 110MB
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Was 200ms — too tight for the hold queue's multi-round-trip operations (join alone makes
      # 4 sequential Redis calls) under any real contention: a Docker CPU spike, a JVM GC pause,
      # or the periodic reconciler sweep, and a command timeout here surfaces to the reader as
      # "the queue won't open". 2s is still well above a healthy same-host round trip but gives
      # real headroom before a transient blip becomes a user-visible failure. See queue audit,
      # 2026-09-20.
      timeout: 2s
  security:
    saml2:
      relyingparty:
        registration:
          tf-reader:
            entity-id: tf-reader-sp
            acs:
              location: "{baseUrl}/login/saml2/sso/{registrationId}"
            assertingparty:
              entity-id: saml-mock
              singlesignon:
                # acs_url is NOT included here — UserSecurityConfig appends it dynamically
                # from the actual request so it works on localhost and Render alike.
                url: ${SAML_MOCK_IDP_URL}
                binding: redirect
                sign-request: false
              verification:
                credentials:
                  - certificate-location: classpath:saml/samlmock-idp.crt

server:
  port: ${SERVER_PORT}
  # Trust X-Forwarded-Proto/Host from Render's reverse proxy so {baseUrl} in SAML
  # ACS location resolves to https:// instead of http://.
  forward-headers-strategy: native

tf:
  catalogue:
    base-url: ${BASE_URL}
  crypto:
    master-key: ${TF_MASTER_KEY}
    master-key-id: master-v1
    device-key-min-bits: 2048
  storage:
    endpoint: ${AWS_S3_ENDPOINT}
    region: ${AWS_S3_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY}
    path-style: false
  ingest:
    poll-interval: 5s
    watchdog-interval: 1m
    # The contract's own number: "Anything stuck for more than fifteen minutes is moved to
    # FAILED by a watchdog."
    watchdog-timeout: 15m
  security:
    jwt:
      issuer: tf-reader
      secret: ${TF_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 12h

tnf:
  seed:
    # False by default: DemoDataSeeder is also gated on @Profile("local") and its own
    # refuseIfNotLocal() host check, but this was the one property that, on its own, defaulted to
    # "on" regardless of profile - fixed here instead of relying on the other two rails alone.
    enabled: false
  # TempDevAuthController's /dev-token mints a token for anyone with no check at all. Off unless a
  # developer's own application-local.yml turns it on, same as mock-oidc.enabled below.
  dev-auth:
    enabled: true
  auth:
    jwt:
      secret: ${TNF_JWT_SECRET}
      ttl: 1h
    # The individual, no-institution sign-in flow: the reader's own username and password go
    # straight to whichever IdP is configured (Azure AD B2C or otherwise) via the password grant.
    # Swapping the four values below is the entire migration - there is no redirect uri to
    # register because there is no browser redirect in this flow.
    oidc:
      client-id: ${OIDC_CLIENT_ID}
      client-secret: ${OIDC_CLIENT_SECRET}
      issuer: ${OIDC_ISSUER}
      token-uri: ${OIDC_TOKEN_URI}
      jwk-set-uri: ${OIDC_JWK_SET_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    redis:
      # Was false — meant a degraded/unreachable Redis (the exact failure mode behind the hold
      # queue's "won't open" symptom) never showed up as anything external, including this
      # actuator health check. Re-enabled so it does. See queue audit, 2026-09-20.
      enabled: true


mock-oidc:
  enabled: false

# Same reasoning as mock-oidc above: SamlMockController mints a token for anyone claiming to be
# john.doe@example.com. Explicit here rather than left as an absent property, so this is asserted
# by SecurityArchitectureTest instead of relying on @ConditionalOnProperty's default-missing
# behaviour going unnoticed if it ever changed.
saml-mock:
  enabled: false

---
spring:
  config:
    activate:
      on-profile: b2c

# Belt and braces: the mock is already false by default, and stating it here
# means "b2c" switches it off even if the profile list also carries "local".
mock-oidc:
  enabled: false
