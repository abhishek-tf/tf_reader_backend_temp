spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: reader
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true

  security:
    saml2:
      relyingparty:
        registration:
          tf-reader:
            entity-id: tf-reader-sp
            acs:
              location: "{baseUrl}/login/saml2/sso/{registrationId}"

            # --- the IdP side (the Asserting Party) ---
            assertingparty:
              entity-id: saml-mock
              singlesignon:
                url: ${SAML_URL}
                binding: redirect
                sign-request: false
              verification:
                credentials:
                  - certificate-location: classpath:saml/samlmock-idp.crt

tf:
  catalogue:
    # Base URL used to build absolute OPDS links. Renamed from tnf.catalogue.base-url;
    # see CatalogueUrlBuilder.
    base-url: ${BASE_URL}

  security:
    jwt:
      issuer: tf-reader
      secret: ${TF_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 12h
tnf:
  auth:
    jwt:
      secret: ${TNF_JWT_SECRET}
      ttl: 1h

# API documentation is off by default and enabled only by the dev profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  health:
    redis:
      enabled: false
