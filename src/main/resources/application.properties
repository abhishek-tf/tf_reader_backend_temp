spring.application.name=reader

# =============================================================================
#  JWT signing
# =============================================================================
#  HS256, one secret, one hour - the PRD's whole token design.
#
#  There is NO DEFAULT SECRET, on purpose. The placeholder below has no fallback
#  value, so the application fails to start unless TNF_JWT_SECRET is set in the
#  environment. A default would mean every forgetful deployment shared a publicly
#  known signing key, and anything that can verify an HS256 token can mint one.
#
#  Generate one:  openssl rand -base64 48
# -----------------------------------------------------------------------------
tnf.auth.jwt.secret=${TNF_JWT_SECRET}
tnf.auth.jwt.ttl=1h

# =============================================================================
#  SAML 2.0 Service Provider
# =============================================================================
#  ONE relying party registration, id "tf-reader", shared by every institution.
#  The institution a user picks is business data held in AuthTransactionStore and
#  never appears here. Adding an institution must never add a registration.
#
#  The IdP is the public mock at https://samlmock.dev/idp.
# -----------------------------------------------------------------------------

# --- our side (the Service Provider) ---
# Audience the IdP must address the assertion to. Must match the aud= below.
spring.security.saml2.relyingparty.registration.tf-reader.entity-id=tf-reader-sp
# Where the IdP POSTs the SAMLResponse. Must match the acs_url= below.
spring.security.saml2.relyingparty.registration.tf-reader.acs.location={baseUrl}/login/saml2/sso/{registrationId}

# --- the IdP side (the Asserting Party) ---
# The Issuer value samlmock.dev puts in the response. It defaults to "saml-mock"
# in their UI; leave that field alone or this will not match.
spring.security.saml2.relyingparty.registration.tf-reader.assertingparty.entity-id=saml-mock

# The SSO endpoint. The aud and acs_url query parameters pre-fill the mock IdP's
# form so a human does not have to retype them; Spring appends SAMLRequest and
# RelayState to this URL. Changing the port means changing acs_url here too.
spring.security.saml2.relyingparty.registration.tf-reader.assertingparty.singlesignon.url=https://samlmock.dev/idp?aud=tf-reader-sp&acs_url=http%3A%2F%2Flocalhost%3A8080%2Flogin%2Fsaml2%2Fsso%2Ftf-reader
spring.security.saml2.relyingparty.registration.tf-reader.assertingparty.singlesignon.binding=redirect

# We do not sign the AuthnRequest. Spring defaults this to true, which would demand
# an SP private key committed to the repository - and samlmock.dev never verifies
# AuthnRequest signatures (there is no verification code in its request parser), so
# it would buy nothing. This does NOT affect validation of the response, which stays
# fully enabled below.
spring.security.saml2.relyingparty.registration.tf-reader.assertingparty.singlesignon.sign-request=false

# SIGNATURE VERIFICATION. The IdP's public certificate, downloaded from
# https://samlmock.dev/api/downloadCert - static, self-signed CN=thameera.com,
# valid until 2044-06-08. Every assertion is verified against it. Remove this and
# the application refuses to start rather than trusting unsigned assertions.
spring.security.saml2.relyingparty.registration.tf-reader.assertingparty.verification.credentials[0].certificate-location=classpath:saml/samlmock-idp.crt
