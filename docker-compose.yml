name: tf_reader

services:
  mongo:
    container_name: tf_reader_mongo
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: tf_reader_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
   container_name: tf_reader_backend
   build: .
   restart: unless-stopped
   ports:
     - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
   env_file:
     - .env
   environment:
     # IMPORTANT: containers communicate using Compose service names
     MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/tnfreader?authSource=admin
     REDIS_HOST: redis
     REDIS_PORT: 6379

   depends_on:
     mongo:
       condition: service_healthy
     redis:
       condition: service_healthy

volumes:
  mongo-data:
